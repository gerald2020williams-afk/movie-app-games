<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Movies &amp; Games</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="logo" aria-hidden="true"></div>
    <nav class="tabs">
      <button class="f tab" data-go="home">Home</button>
      <button class="f tab" data-go="movies">Movies</button>
      <button class="f tab" data-go="search">Search</button>
    </nav>
    <span class="spacer"></span>
    <span class="pad" id="pad" hidden><b></b>Controller connected</span>
    <button class="f who" data-go="profiles">Watching as <b id="who-name">—</b><span class="avatar" id="who-avatar">?</span></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/input.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/history.js"></script>
  <script src="js/cast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Movies &amp; Games</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movies">
  <link rel="preconnect" href="https://archive.org">
  <link rel="preload" href="catalog.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="dist/styles.min.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="logo" role="img" aria-label="Movies"></div>
    <nav class="tabs" aria-label="Main">
      <button class="f tab" data-go="home"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg><span>Home</span></button>
      <button class="f tab" data-go="live"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 6h-7.6l3.3-3.3-.7-.7L12 5.6 8 2l-.7.7L10.6 6H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 13H3V8h18z"/></svg><span>Live</span></button>
      <button class="f tab" data-go="movies"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4z"/></svg><span>Movies</span></button>
      <button class="f tab" data-go="search"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg><span>Search</span></button>
    </nav>
    <span class="spacer"></span>
    <span class="pad" id="pad" hidden><b></b>Controller connected</span>
    <button class="f btn nav-btn" id="remote-btn">Phone remote</button>
    <button class="f who" data-go="profiles">Watching as <b id="who-name">—</b><span class="avatar" id="who-avatar">?</span></button>
  </header>

  <main id="view" tabindex="-1" aria-live="off"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- All scripts, bundled and shrunk by scripts/build.js (sources are in js/). -->
  <script src="dist/app.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Movies &amp; Games</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movies">
  <link rel="preconnect" href="https://archive.org">
  <link rel="preload" href="catalog.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="dist/styles.min.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="logo" role="img" aria-label="Movies"></div>
    <nav class="tabs" aria-label="Main">
      <button class="f tab" data-go="home">Home</button>
      <button class="f tab" data-go="live">Live</button>
      <button class="f tab" data-go="movies">Movies</button>
      <button class="f tab" data-go="search">Search</button>
    </nav>
    <span class="spacer"></span>
    <span class="pad" id="pad" hidden><b></b>Controller connected</span>
    <button class="f btn nav-btn" id="remote-btn">Phone remote</button>
    <button class="f who" data-go="profiles">Watching as <b id="who-name">—</b><span class="avatar" id="who-avatar">?</span></button>
  </header>

  <main id="view" tabindex="-1" aria-live="off"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- All scripts, bundled and shrunk by scripts/build.js (sources are in js/). -->
  <script src="dist/app.min.js"></script>
</body>
</html>
